name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: aviation_ci_test
          POSTGRES_USER: aviation_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aviation_ci -d aviation_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://aviation_ci:ci_only_password@127.0.0.1:5432/aviation_ci_test
      TEST_DATABASE_URL: postgresql://aviation_ci:ci_only_password@127.0.0.1:5432/aviation_ci_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.txt
            pyproject.toml
      - name: Install project and quality tools
        run: python -m pip install -e '.[test]' -c requirements.lock
      - name: Lint and static checks
        run: |
          ruff check .
          python -m compileall -q src scripts tests wsgi.py
          bash -n scripts/entrypoint scripts/start
          python -m pip check
      - name: Initialize PostgreSQL and load deterministic test fixtures
        run: |
          python scripts/database.py migrate
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              conn.execute(Path('tests/seed.sql').read_text(), prepare=False)
          PY
          python scripts/database.py refresh-stats
      - name: Run complete suite and coverage
        run: >-
          pytest -ra --cov=aviation_api --cov=scripts --cov-branch
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/htmlcov --junitxml=reports/junit.xml
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
