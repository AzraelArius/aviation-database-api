[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-database-api"
version = "0.1.0"
description = "Flask and PostgreSQL aviation management API"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["aviation_api", "scripts"]
relative_files = true

[tool.coverage.report]
show_missing = true
